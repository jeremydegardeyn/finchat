##############################################################################
# Controls alerting (ADR-0026): control-event log entry -> ServiceNow em_event.
#
# Triggered by Eventarc from a Pub/Sub topic fed by a Cloud Logging sink. The sink
# selects only the redacted control events emitted by ui/control_events.py and the
# Composer on_failure_callback — never Model Armor's raw sanitize logs, which carry
# the flagged prompt and must stay inside GCP (docs/26 F3).
#
# This writes an `em_event` row rather than calling the Connectors endpoint, which is
# a Store app not entitled on the target instance (F9). Event Management still owns
# correlation: `message_key` collapses events into one `em_alert`, and
# `em_alert_management_rule` decides what becomes an incident.
#
# Two Workflows constraints shape the code below, both found at deploy time:
#   * `env` is a RESERVED variable name — the environment is held in `environment`.
#   * map literals cannot appear inside a ${} expression, so any map destined for
#     json.encode_to_string is assembled as a YAML block first (see build_info).
##############################################################################
main:
  params: [event]
  steps:
    - decode_log_entry:
        assign:
          - entry: ${json.decode(text.decode(base64.decode(event.data.message.data)))}
          - ce: ${map.get(entry, ["jsonPayload", "control_event"])}

    # A sink filter is a coarse instrument; anything that slips through and is not a
    # control event is dropped here rather than becoming a malformed ServiceNow row.
    - guard_shape:
        switch:
          - condition: ${ce == null}
            return: "skipped: not a control event"

    - defaults:
        assign:
          - svc: ${default(map.get(entry, ["resource", "labels", "service_name"]), "")}
          - environment: ${default(map.get(ce, "environment"), "unknown")}
          - filters: ${default(map.get(ce, "filters"), [])}
          - severity: "4"
          - elevated: false

    # Environment comes from resource identity where it exists. The Cloud Run service
    # name is stamped by the platform and the workload cannot forge it; the copy inside
    # the payload is emitter-set and therefore only advisory (docs/26 F18). Composer and
    # other sources have no service_name and fall back to the payload value.
    - env_from_resource_identity:
        switch:
          - condition: ${text.match_regex(svc, "^finchat-(dev|test|prod)-")}
            assign:
              - environment: ${text.split(svc, "-")[1]}

    # Prompt injection, sensitive-data and malicious-URL hits outrank harmful-content
    # hits: the first three are attacks or leaks, the last is usually a rude user.
    - detect_elevated_filters:
        for:
          value: f
          in: ${filters}
          steps:
            - check:
                switch:
                  - condition: ${f == "pi_and_jailbreak" or f == "sdp" or f == "malicious_uris"}
                    assign:
                      - elevated: true

    # Nonprod stays at 4 (Warning): visible in Event Management, below the promotion
    # threshold. That keeps nonprod signal without manufacturing nonprod incidents —
    # switching nonprod off entirely is how a staging warning that predicted a prod
    # outage goes unseen.
    - derive_severity:
        switch:
          - condition: ${environment == "prod" and elevated}
            assign:
              - severity: "2"
          - condition: ${environment == "prod"}
            assign:
              - severity: "3"

    - read_credentials:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: ${sys.get_env("SN_SECRET_ID")}
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: sn_password

    # ServiceNow date fields want "YYYY-MM-DD HH:MM:SS". Handed the ISO-8601 string the
    # envelope carries ("2026-08-30T21:45:37.296025+00:00") its parser takes the date and
    # silently zeroes the time, so every event lands at midnight — verified in the first
    # end-to-end run, where five events an hour apart all read 00:00:00. That destroys
    # chronology in the one system a responder actually looks at, and it fails quietly.
    - format_event_time:
        assign:
          - occurred: ${default(map.get(ce, "occurred_at"), "")}
          - sn_time: ""
    - convert_event_time:
        switch:
          - condition: ${text.match_regex(occurred, "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}")}
            assign:
              - iso_parts: ${text.split(occurred, "T")}
              - sn_time: ${iso_parts[0] + " " + text.substring(iso_parts[1], 0, 8)}

    # Assembled as YAML, not as a map literal inside ${}. Every field is metadata: no
    # prompt, no response, no exception text, no row value (ADR-0026 point 4).
    - build_info:
        assign:
          - info:
              environment: ${environment}
              principal_hash: ${default(map.get(ce, "principal_hash"), "")}
              evidence_ref: ${default(map.get(ce, "evidence_ref"), "")}
              filters: ${filters}
          - info_json: ${json.encode_to_string(info)}
          - basic: ${"Basic " + base64.encode(text.encode(sys.get_env("SN_USER") + ":" + sn_password))}

    - build_row:
        assign:
          - row:
              source: "GCP"
              event_class: "finchat"
              node: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
              # Names the CMDB class the `node` value should resolve against. Without it,
              # Event Management resolves `node` against HOST classes and logs "Failed to
              # find the host with name: <project>"; there is no host, and the alert binds
              # to nothing. The GCP project is modelled as cmdb_ci_appl.
              #
              # This is necessary but, on the target instance, not sufficient: with a CI of
              # class Application present and matching `node` exactly, some events bind and
              # others still record the host-resolution failure (docs/26 F20). Assignment
              # therefore continues to come from a hardcoded group rather than from CI
              # ownership, which is the thing binding was supposed to buy. Read an event's
              # processing notes before believing the routing path works.
              ci_type: "cmdb_ci_appl"
              resource: ${if(svc != "", svc, environment)}
              type: ${default(map.get(ce, "control_id"), "unknown")}
              severity: ${severity}
              message_key: ${default(map.get(ce, "message_key"), "")}
              time_of_event: ${sn_time}
              description: '${default(map.get(ce, "source"), "control") + " match " + json.encode_to_string(filters)}'
              additional_info: ${info_json}

    - post_event:
        try:
          call: http.post
          args:
            url: ${sys.get_env("SN_INSTANCE_URL") + "/api/now/table/em_event"}
            headers:
              Content-Type: "application/json"
              Authorization: ${basic}
            body: ${row}
            timeout: 30
          result: sn_response
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 2
            max_delay: 60
            multiplier: 2

    # --- Chat notification (optional, best-effort) ---------------------------
    # ServiceNow remains the record; this is awareness. It runs AFTER the em_event POST
    # and its failure never fails the execution — a broken webhook must not cost us the
    # auditable record, which is the whole reason the planes are separate.
    - chat_gate:
        switch:
          - condition: ${sys.get_env("CHAT_SECRET_ID") == ""}
            next: done
    - notify_chat:
        try:
          steps:
            - read_webhook:
                call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                args:
                  secret_id: ${sys.get_env("CHAT_SECRET_ID")}
                  project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                result: chat_url
            - chat_common:
                assign:
                  # Link back to the event record so a responder can cross into the system
                  # of record. It is not the incident number — posting from here rather
                  # than from ServiceNow is what costs us that.
                  - sn_id: ${default(map.get(sn_response, ["body", "result", "sys_id"]), "")}
                  - sn_link: ${sys.get_env("SN_INSTANCE_URL") + "/nav_to.do?uri=em_event.do?sys_id=" + sn_id}
                  - ce_source: ${default(map.get(ce, "source"), "")}
                  - ce_control: ${default(map.get(ce, "control_id"), "")}
                  - ce_principal: ${default(map.get(ce, "principal_hash"), "")}
                  - chat_body: {}
            # Metadata only, same rule as the em_event row: which detectors fired, never
            # what they fired on. Two providers, two payload shapes, one hop.
            - shape_payload:
                switch:
                  - condition: ${sys.get_env("CHAT_PROVIDER") == "google_chat"}
                    assign:
                      - chat_body:
                          text: '${"*Control violation — " + environment + "*
" + "source: " + ce_source + "
control: " + ce_control + "
detectors: " + json.encode_to_string(filters) + "
severity: " + severity + "
principal: " + ce_principal + "
<" + sn_link + "|open the ServiceNow event>"}'
                  - condition: true
                    assign:
                      - chat_body:
                          attachments:
                            - contentType: "text/html"
                              content: '${"<strong>Control violation — " + environment + "</strong><br/>" + "<div>source: " + ce_source + "</div>" + "<div>control: " + ce_control + "</div>" + "<div>detectors: " + json.encode_to_string(filters) + "</div>" + "<div>severity: " + severity + "</div>" + "<div>principal: " + ce_principal + "</div>" + "<div><a href=\"" + sn_link + "\">open the ServiceNow event</a></div>"}'
            - post_card:
                call: http.post
                args:
                  url: ${chat_url}
                  headers:
                    Content-Type: "application/json"
                  body: ${chat_body}
                  timeout: 20
        except:
          as: e
          steps:
            - swallow:
                assign:
                  - chat_error: ${e}

    - done:
        return:
          status: ${sn_response.code}
          message_key: ${row.message_key}
          severity: ${severity}
          environment: ${environment}
