name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyflakes

      # Catches undefined names before they become a runtime NameError in a code path
      # nobody exercised. KB_DATASET shipped to prod referenced-but-never-defined and
      # only surfaced when a user asked a platform question; pyflakes flagged all three
      # occurrences in under a second. Scoped to undefined-name errors deliberately -
      # a style linter here would be noise nobody reads.
      - name: Static check — undefined names
        run: |
          python -m pyflakes ui/*.py scripts/*.py mcp_server/*.py products/*/*/*.py products/*/*/*/*.py             2>/dev/null | grep -E "undefined name" && {
              echo "::error::undefined name(s) found — see above"; exit 1; } || true
      - name: Pipeline transform tests (Beam-free)
        working-directory: products/transactions/pipeline
        run: pytest test_transforms.py -q
      - name: Loan risk-scoring tests
        working-directory: products/loans/api
        run: pytest test_risk.py -q
      - name: Ontology SSOT — perimeter/joins/graph drift guard
        run: pip install pyyaml && pytest scripts/test_ontology.py -q
      - name: OKF context — perimeter + drift guard
        working-directory: ui
        run: pip install pyyaml && pytest test_okf_context.py -q
      - name: Hybrid retrieval — BM25 / RRF / rerank parsing (offline)
        working-directory: products/transactions/agent
        run: pytest test_retrieval.py -q
      - name: Steward harness reasoning tests (offline)
        working-directory: products/steward/harness
        run: pytest test_offline.py -q
      - name: Agent registry — gate tests (ADR-0023)
        run: pytest scripts/test_agent_registry.py -q
      - name: Control-event envelope + redaction guard (ADR-0026)
        working-directory: ui
        run: pytest test_control_events.py -q
      - name: Safety block reaches the user, not demo data (ADR-0026)
        working-directory: ui
        run: pytest test_block_surfacing.py -q
      - name: Controls dispatch workflow — drift guard (ADR-0026)
        run: pip install pyyaml && pytest scripts/test_controls_workflow.py -q
      - name: Reconciliation control — divergence logic (ADR-0026)
        run: pytest scripts/test_reconcile_controls.py -q
      - name: DLP resource paths — regional templates (ADR-0026)
        working-directory: products/transactions/pipeline
        run: pytest test_dlp_paths.py -q
      - name: ADK gateway adapter — tool-call round trip + refusal handling (ADR-0024)
        working-directory: products/transactions/agent
        run: pytest test_gateway_llm.py -q
      - name: Gateway client — bypass accounting + refusal handling (ADR-0024)
        working-directory: ui
        run: pytest test_gateway_client.py -q
      - name: UI image — every runtime module is COPYed
        working-directory: ui
        run: pytest test_ui_image.py -q
      - name: Analyst intent router — routing + no-thinking guard
        working-directory: ui
        run: pytest test_intent_router.py -q
      - name: Model pinning + canary drift control tests (ADR-0022)
        run: pytest scripts/test_canary_eval.py -q

      - name: MCP surface — tool scoping, omissions, knowledge plane (ADR-0028)
        run: pytest mcp_server -q
      - name: Canary wiring smoke (no live endpoint)
        run: python scripts/canary_eval.py dev --offline
      - name: Generator invariant check (<=4 per customer)
        working-directory: products/transactions/generator
        run: |
          python generate.py --count 500 --seed 1 --dry-run > out.jsonl
          python - <<'PY'
          import json, collections
          rows=[json.loads(l) for l in open('out.jsonl')]
          per=collections.Counter(r['account_id'] for r in rows)
          assert max(per.values())<=4, "invariant violated"
          print(f"OK {len(rows)} txns, max/customer={max(per.values())}")
          PY

  # The registry gate is its own job so a drift failure is legible in the checks list
  # rather than buried in a test summary. This is the control that stops an agent
  # reaching production without a distinct identity, a named owner, a scoped tool
  # allow-list, and a live recertification date.
  agent-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify registry against source (drift + gateway transit)
        run: python scripts/verify_agent_registry.py --env prod
      - name: Terraform projection is current
        run: |
          for e in dev test prod; do
            python scripts/agents_catalog.py --env "$e" \
              --emit-tfvars "infra/envs/$e/agents.auto.tfvars.json"
          done
          if ! git diff --quiet -- infra/envs/*/agents.auto.tfvars.json; then
            echo "::error::agents.auto.tfvars.json is stale — regenerate with scripts/agents_catalog.py and commit"
            git diff -- infra/envs/*/agents.auto.tfvars.json
            exit 1
          fi

  # Policy-as-code (ADR-0027). Its own job for the same reason the registry gate is one:
  # a policy failure should be legible in the checks list rather than buried in a test
  # summary. This job needs no cloud credentials — the Terraform rules are unit-tested
  # against synthetic plan fragments here, and evaluated against a real plan in
  # `.github/workflows/infra.yml`, which is the only workflow that can produce one.
  policy:
    runs-on: ubuntu-latest
    env:
      # Pinned. An unpinned policy engine changes the rules' meaning on someone else's
      # release schedule, which is the one thing a control must not do.
      CONFTEST_VERSION: "0.69.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conftest
        run: |
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      # The rules are a control, so they get the same treatment as the code they gate:
      # a test proving each one fires on the violation it names, and a test proving it
      # stays quiet on the compliant case. A rule nobody has seen fail is not a control.
      - name: Policy unit tests — Terraform posture rules
        run: conftest verify --policy policy/terraform

      - name: Policy unit tests — agent registry rules
        run: conftest verify --policy policy/registry

      # REG-1/2/3 and LIFE-1/2 against the committed registry, in every environment.
      # These moved out of verify_agent_registry.py; that script now owns only the
      # checks that have to read the agent source files.
      - name: Agent registry policy — REG / LIFE (dev, test, prod)
        run: |
          for e in dev test prod; do
            echo "::group::$e"
            python scripts/agents_catalog.py --env "$e" --emit-policy-input - \
              | conftest test --policy policy/registry --namespace finchat.registry \
                  --parser json -
            echo "::endgroup::"
          done

  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AgentOps evaluation (gates on grounding/tool-use/approval thresholds)
        working-directory: eval/pipelines
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, test, prod]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: fmt check
        run: terraform fmt -check -recursive infra
      - name: init + validate (${{ matrix.env }})
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker-build-mcp:
    # Separate job: the MCP image copies modules owned by other services, so its
    # build context is the repo root rather than its own directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build MCP image (no push)
        run: docker build -f mcp_server/Dockerfile -t finchat-mcp-ci-test .

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - products/transactions/api
          - products/transactions/generator
          - products/loans/api
          - products/steward/harness
          - ui
    steps:
      - uses: actions/checkout@v5
      - name: Build image (no push)
        run: docker build -t finchat-ci-test ${{ matrix.service }}
