name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Pipeline transform tests (Beam-free)
        working-directory: products/transactions/pipeline
        run: pytest test_transforms.py -q
      - name: Loan risk-scoring tests
        working-directory: products/loans/api
        run: pytest test_risk.py -q
      - name: Ontology SSOT — perimeter/joins/graph drift guard
        run: pip install pyyaml && pytest scripts/test_ontology.py -q
      - name: OKF context — perimeter + drift guard
        working-directory: ui
        run: pip install pyyaml && pytest test_okf_context.py -q
      - name: Hybrid retrieval — BM25 / RRF / rerank parsing (offline)
        working-directory: products/transactions/agent
        run: pytest test_retrieval.py -q
      - name: Steward harness reasoning tests (offline)
        working-directory: products/steward/harness
        run: pytest test_offline.py -q
      - name: Agent registry — gate tests (ADR-0023)
        run: pytest scripts/test_agent_registry.py -q
      - name: ADK gateway adapter — tool-call round trip + refusal handling (ADR-0024)
        working-directory: products/transactions/agent
        run: pytest test_gateway_llm.py -q
      - name: Gateway client — bypass accounting + refusal handling (ADR-0024)
        working-directory: ui
        run: pytest test_gateway_client.py -q
      - name: Model pinning + canary drift control tests (ADR-0022)
        run: pytest scripts/test_canary_eval.py -q
      - name: Canary wiring smoke (no live endpoint)
        run: python scripts/canary_eval.py dev --offline
      - name: Generator invariant check (<=4 per customer)
        working-directory: products/transactions/generator
        run: |
          python generate.py --count 500 --seed 1 --dry-run > out.jsonl
          python - <<'PY'
          import json, collections
          rows=[json.loads(l) for l in open('out.jsonl')]
          per=collections.Counter(r['account_id'] for r in rows)
          assert max(per.values())<=4, "invariant violated"
          print(f"OK {len(rows)} txns, max/customer={max(per.values())}")
          PY

  # The registry gate is its own job so a drift failure is legible in the checks list
  # rather than buried in a test summary. This is the control that stops an agent
  # reaching production without a distinct identity, a named owner, a scoped tool
  # allow-list, and a live recertification date.
  agent-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify registry against source (drift / ownership / recertification)
        run: python scripts/verify_agent_registry.py --env prod
      - name: Terraform projection is current
        run: |
          for e in dev test prod; do
            python scripts/agents_catalog.py --env "$e" \
              --emit-tfvars "infra/envs/$e/agents.auto.tfvars.json"
          done
          if ! git diff --quiet -- infra/envs/*/agents.auto.tfvars.json; then
            echo "::error::agents.auto.tfvars.json is stale — regenerate with scripts/agents_catalog.py and commit"
            git diff -- infra/envs/*/agents.auto.tfvars.json
            exit 1
          fi

  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AgentOps evaluation (gates on grounding/tool-use/approval thresholds)
        working-directory: eval/pipelines
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, test, prod]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: fmt check
        run: terraform fmt -check -recursive infra
      - name: init + validate (${{ matrix.env }})
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - products/transactions/api
          - products/transactions/generator
          - products/loans/api
          - products/steward/harness
          - ui
    steps:
      - uses: actions/checkout@v5
      - name: Build image (no push)
        run: docker build -t finchat-ci-test ${{ matrix.service }}
