name: Build & Deploy

on:
  push:
    branches: [main]
    # mcp_server/** is here because it is a deployed service (ADR-0031), not only a
    # local stdio entry point. Without it a change to the agent channel builds
    # nothing and the running service silently keeps the previous image.
    paths: ["products/**", "ui/**", "mcp_server/**",
            ".github/workflows/build-deploy.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, test, prod]
        default: dev

# Keyless auth to GCP via Workload Identity Federation (no SA keys).
permissions:
  contents: read
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # GitHub Environments gate promotion (required reviewers on test/prod) and
    # supply WIF_PROVIDER/DEPLOY_SA/GCP_* as environment variables. (No job-level
    # `if` guard on those vars — env-scoped vars aren't visible to job-level `if`.)
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the Flex Template step diffs against the commit that built the
          # currently published template, which a shallow clone does not contain.
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
          service_account: ${{ vars.DEPLOY_SA }}                  # finchat-<env>-cicd@PROJECT.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push images
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT}/finchat-${ENV}-images"
          SHA="${GITHUB_SHA::12}"
          # Bake the latest AgentOps eval report into the UI image (Admin -> Evaluations).
          cp -f eval/reports/latest.json ui/eval_report.json 2>/dev/null || true
          declare -A SVC=(
            [txn-api]=products/transactions/api
            [txn-generator]=products/transactions/generator
            [loan-api]=products/loans/api
            [process]=products/process/api
            [mobile]=products/experience/mobile
            [agent]=products/transactions/agent
            [steward]=products/steward/harness
            [ui]=ui
            [mcp-auth]=products/mcp_auth
            # Repo root, not mcp_server/: the MCP server reuses modules owned by the
            # services it fronts, and copying them at build time is what keeps the
            # knowledge plane one source of truth instead of a snapshot (ADR-0028).
            [mcp]=.
          )
          declare -A DOCKERFILE=(
            [mcp]=mcp_server/Dockerfile
          )
          for name in "${!SVC[@]}"; do
            img="${REPO}/${name}:${SHA}"
            echo "::group::build ${name}"
            docker build -f "${DOCKERFILE[$name]:-${SVC[$name]}/Dockerfile}"               -t "$img" -t "${REPO}/${name}:latest" "${SVC[$name]}"
            docker push "$img"; docker push "${REPO}/${name}:latest"
            echo "::endgroup::"
          done

      # The platform-docs corpus is a build artifact of the repo, so it goes stale the
      # moment an ADR lands. docs/24 flagged this as a known gap and it proved itself
      # within the hour: two new docs and a corrected ADR were unsearchable until someone
      # remembered to re-run the script. Embedding ~455 chunks costs cents, so refreshing
      # unconditionally is cheaper than reasoning about whether it is needed.
      - name: Refresh platform docs corpus (ADR-0024 / docs-24)
        continue-on-error: true   # never block a deploy on the search corpus
        run: |
          pip install --quiet google-cloud-bigquery
          bash products/transactions/agent/kb/setup_platform_rag.sh "${ENV}"

      - name: Deploy Cloud Run services
        env:
          # Model pins (ADR-0022). Set these as repo/environment variables to move a call
          # site off its floating alias onto a Model Garden snapshot. Left unset, each
          # service runs its alias and the registry gate reports PIN-1 — a declared
          # posture rather than an accidental one.
          PIN_AGENT: ${{ vars.FINCHAT_PIN_AGENT }}
          PIN_ROUTER: ${{ vars.FINCHAT_PIN_ROUTER }}
          PIN_SEMANTICS: ${{ vars.FINCHAT_PIN_SEMANTICS }}
          PIN_JUDGE: ${{ vars.FINCHAT_PIN_JUDGE }}
          PIN_STEWARD: ${{ vars.FINCHAT_PIN_STEWARD }}
          # Unset -> every call site bypasses direct to Vertex, and counts it (ADR-0024).
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          # Per-call-site Vertex location. Gemini 3 is global-endpoint-only, so a
          # model choice and a residency choice are the same choice here (ADR-0022).
          LOC_ROUTER: ${{ vars.FINCHAT_LOC_ROUTER }}
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT}/finchat-${ENV}-images"
          SHA="${GITHUB_SHA::12}"

          # Emit ",FINCHAT_PIN_X=v" only for pins that are actually set — an empty value
          # would land as an empty env var, and empty is indistinguishable from unset at
          # the call site only by accident. Keep it explicit.
          pin() { [ -n "$2" ] && printf ',FINCHAT_PIN_%s=%s' "$1" "$2" || true; }
          AGENT_PINS="$(pin AGENT "$PIN_AGENT")"
          STEWARD_PINS="$(pin STEWARD "$PIN_STEWARD")$(pin JUDGE "$PIN_JUDGE")"
          loc() { [ -n "$2" ] && printf ',FINCHAT_LOC_%s=%s' "$1" "$2" || true; }
          UI_PINS="$(pin ROUTER "$PIN_ROUTER")$(pin SEMANTICS "$PIN_SEMANTICS")$(pin JUDGE "$PIN_JUDGE")$(loc ROUTER "$LOC_ROUTER")"
          deploy() { # name image-name service-account extra-env
            # --cpu-boost: extra CPU during container startup only (no idle cost) —
            # meaningfully shortens Python cold starts on scale-to-zero services.
            gcloud run deploy "finchat-${ENV}-$1" \
              --image "${REPO}/$2:${SHA}" --region "${REGION}" \
              --service-account "finchat-${ENV}-$3@${PROJECT}.iam.gserviceaccount.com" \
              --cpu-boost --quiet $4
          }
          deploy txn-api txn-api txn-api \
            "--set-env-vars=GCP_PROJECT=${PROJECT},GOLD_DATASET=finchat_gold_${ENV},SILVER_DATASET=finchat_silver_${ENV} --no-allow-unauthenticated"
          deploy loan-api loan-api loan-api \
            "--set-env-vars=GCP_PROJECT=${PROJECT},LOANS_DATASET=finchat_loans_${ENV},TXN_API_URL=$(gcloud run services describe finchat-${ENV}-txn-api --region ${REGION} --format='value(status.url)') --no-allow-unauthenticated"
          # Process layer (ADR-0030). Composes the two system APIs above, so it is deployed
          # after them and resolves their URLs the same way the loan API resolves txn-api.
          deploy process process process             "--set-env-vars=TXN_API_URL=$(gcloud run services describe finchat-${ENV}-txn-api --region ${REGION} --format='value(status.url)'),LOAN_API_URL=$(gcloud run services describe finchat-${ENV}-loan-api --region ${REGION} --format='value(status.url)') --no-allow-unauthenticated"
          # Mobile experience API. PROCESS_API_URL is its ONLY backend — LAYER-1 as
          # configuration, matching the IAM: this SA holds no invoker grant on any system API.
          deploy mobile mobile mobile             "--set-env-vars=PROCESS_API_URL=$(gcloud run services describe finchat-${ENV}-process --region ${REGION} --format='value(status.url)') --no-allow-unauthenticated"
          # ADK agent on Cloud Run (scale-to-zero). Gemini via Vertex (agent SA has aiplatform.user).
          deploy agent agent agent \
            "--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=${REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,KB_DATASET=finchat_kb_${ENV},TXN_API_URL=$(gcloud run services describe finchat-${ENV}-txn-api --region ${REGION} --format='value(status.url)'),LOAN_API_URL=$(gcloud run services describe finchat-${ENV}-loan-api --region ${REGION} --format='value(status.url)'),AI_GATEWAY_URL=${AI_GATEWAY_URL},AI_GATEWAY_REQUIRED=${{ vars.AI_GATEWAY_REQUIRED || '0' }}${AGENT_PINS} --memory=1Gi --no-allow-unauthenticated"
          # OAuth proxy for hosted MCP clients (ADR-0020). Deployed only where Terraform
          # provisioned it — it is the platform's one public service, so an environment
          # that did not ask for it does not silently acquire it.
          #
          # OAUTH_ISSUER is the service's own URL: every OAuth artefact it publishes must
          # be absolute and must match what a client dialled, or discovery fails in ways
          # that read as "the connector is broken".
          #
          # Unset OAUTH_ALLOWED_* would mean this refuses everyone, which is the correct
          # failure — but it would also be an odd thing to deploy on purpose, so both are
          # set here from repo variables.
          #
          # The signing key comes from Secret Manager rather than being generated per
          # instance: an ephemeral key rejects the tokens it issued moments earlier as
          # soon as a cold start or a second instance appears, and the symptom is
          # "it logs me out sometimes". FIRESTORE_DATABASE is named for a related
          # reason — this project's (default) database is in DATASTORE mode, so the
          # Firestore client cannot use it and the store degrades silently to memory,
          # which cannot redeem a code issued by another instance.
          if gcloud run services describe "finchat-${ENV}-mcp-auth" --region "${REGION}" >/dev/null 2>&1; then
            AUTH_URL="$(gcloud run services describe finchat-${ENV}-mcp-auth --region ${REGION} --format='value(status.url)')"
            MCP_RESOURCE="$(gcloud run services describe finchat-${ENV}-mcp --region ${REGION} --format='value(status.url)')/mcp"
            deploy mcp-auth mcp-auth mcp-auth               "--set-secrets=GOOGLE_OAUTH_CLIENT_SECRET=finchat-oauth-client-secret:latest,OAUTH_SIGNING_KEY_PEM=finchat-${ENV}-mcp-oauth-signing-key:latest --set-env-vars=OAUTH_ISSUER=${AUTH_URL},GCP_PROJECT=${PROJECT},FIRESTORE_DATABASE=${{ vars.FINCHAT_OAUTH_FIRESTORE_DB || '(default)' }},GOOGLE_OAUTH_CLIENT_ID=${{ vars.FINCHAT_OAUTH_CLIENT_ID }},OAUTH_ALLOWED_DOMAINS=${{ vars.FINCHAT_OAUTH_ALLOWED_DOMAINS }},OAUTH_ALLOWED_EMAILS=${{ vars.FINCHAT_OAUTH_ALLOWED_EMAILS }},OAUTH_ALLOWED_RESOURCES=${MCP_RESOURCE} --allow-unauthenticated"
          else
            echo "finchat-${ENV}-mcp-auth not provisioned (enable_mcp_oauth is false) — skipping."
          fi
          # ADR-0020 token validation turns on only when the issuer and resource are set,
          # and those are per-environment variables rather than code. Unset — the default
          # everywhere — the service stays private and Cloud Run IAM is the only control.
          # Set, the server validates every request itself, which is what makes going
          # public survivable: the two are meant to move together, and the deploy flag
          # below is deliberately NOT derived from them, so nobody opens the door by
          # editing one variable.
          #
          # Agent channel over HTTP (ADR-0031). Deployed after the services it calls,
          # and it has to be told its own hostname: the MCP SDK's DNS-rebinding protection
          # trusts localhost only, so Cloud Run's proxied Host comes back as a bare 421
          # unless it is allow-listed, with nothing in the error saying so.
          #
          # Terraform owns the service shell, and an env that has not been applied simply
          # does not have one. Skip rather than fail — the MCP channel is optional and an
          # env without it must still get its UI. Same posture as the steward guard below.
          if gcloud run services describe "finchat-${ENV}-mcp" --region "${REGION}" >/dev/null 2>&1; then
            MCP_URL="$(gcloud run services describe finchat-${ENV}-mcp --region ${REGION} --format='value(status.url)')"
            deploy mcp mcp mcp             "--set-env-vars=FINCHAT_MCP_TRANSPORT=http,FINCHAT_MCP_ALLOWED_HOSTS=${MCP_URL#https://},FINCHAT_MCP_PERSONA=customer,FINCHAT_MCP_OAUTH_ISSUER=${{ vars.FINCHAT_MCP_OAUTH_ISSUER }},FINCHAT_MCP_RESOURCE=${{ vars.FINCHAT_MCP_RESOURCE }},FINCHAT_MCP_SERVICE_CALLERS=${{ vars.FINCHAT_MCP_SERVICE_CALLERS }},FINCHAT_TXN_API_URL=$(gcloud run services describe finchat-${ENV}-txn-api --region ${REGION} --format='value(status.url)'),FINCHAT_LOAN_API_URL=$(gcloud run services describe finchat-${ENV}-loan-api --region ${REGION} --format='value(status.url)'),FINCHAT_PROCESS_API_URL=$(gcloud run services describe finchat-${ENV}-process --region ${REGION} --format='value(status.url)'),FINCHAT_AGENT_URL=$(gcloud run services describe finchat-${ENV}-agent --region ${REGION} --format='value(status.url)') --no-allow-unauthenticated"
          else
            echo "finchat-${ENV}-mcp not provisioned (terraform apply pending) — skipping."
          fi
          # Durable steward — deploy ONLY where the harness infra is applied (DB-URL
          # secret) AND its Cloud SQL instance is actually running. The instance is
          # parked (STOPPED) for cost in some envs; DBOS runs migrations against it on
          # startup, so deploying against a stopped DB crash-loops the container and
          # fails the port probe. Guard on instance state, not just the secret — and
          # since steward is optional, never let it abort the rest of the deploy (the
          # UI must still ship). TF owns the SQL + secret + Cloud Run shell; here we
          # deploy the real image + env (DBOS_DATABASE_URL from Secret Manager + the
          # Cloud SQL connector socket), running as the agent SA.
          STEWARD_DB_STATE=$(gcloud sql instances describe "finchat-${ENV}-steward" --format='value(state)' 2>/dev/null || true)
          if gcloud secrets describe "finchat-${ENV}-steward-db-url" >/dev/null 2>&1 && [ "${STEWARD_DB_STATE}" = "RUNNABLE" ]; then
            deploy steward steward agent \
              "--add-cloudsql-instances=${PROJECT}:${REGION}:finchat-${ENV}-steward --set-secrets=DBOS_DATABASE_URL=finchat-${ENV}-steward-db-url:latest --set-env-vars=HUMAN_WAIT_SECONDS=7200,ENV=${ENV},GCP_PROJECT=${PROJECT},DQ_SCANS=silver-txn-quality,GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=${REGION},AI_GATEWAY_URL=${AI_GATEWAY_URL}${STEWARD_PINS} --no-allow-unauthenticated" \
              || echo "::warning::steward deploy failed — continuing without it (UI deploy still proceeds)"
          else
            echo "steward not deployed in ${ENV} (db-url secret or RUNNABLE Cloud SQL absent; instance state='${STEWARD_DB_STATE:-none}') — skipping"
          fi
          deploy ui ui txn-api \
            "--set-secrets=GOOGLE_OAUTH_CLIENT_SECRET=finchat-oauth-client-secret:latest --set-env-vars=LOAN_API_URL=$(gcloud run services describe finchat-${ENV}-loan-api --region ${REGION} --format='value(status.url)'),TXN_API_URL=$(gcloud run services describe finchat-${ENV}-txn-api --region ${REGION} --format='value(status.url)'),AGENT_URL=$(gcloud run services describe finchat-${ENV}-agent --region ${REGION} --format='value(status.url)'),GCP_PROJECT=${PROJECT},MODEL_ARMOR_LOCATION=${REGION},MODEL_ARMOR_TEMPLATE=finchat-${ENV}-armor,CONTROL_EVENTS=${{ vars.CONTROL_EVENTS || '0' }},AI_GATEWAY_REQUIRED=${{ vars.AI_GATEWAY_REQUIRED || '0' }},SILVER_DATASET=finchat_silver_${ENV},GOLD_DATASET=finchat_gold_${ENV},LOANS_DATASET=finchat_loans_${ENV},GRAPH_DATASET=finchat_graph_${ENV},KB_DATASET=finchat_kb_${ENV},EVAL_DATASET=finchat_eval_${ENV},DATA_AGENT_ID=finchat-${ENV}-analyst,ANON_ANALYST_SA=finchat-${ENV}-analyst-anon@${PROJECT}.iam.gserviceaccount.com,CA_LOCATION=global,VERTEX_LOCATION=${REGION},GOOGLE_OAUTH_CLIENT_ID=240219253111-nj35dnaod2mdccu6d81v98urp9h7se72.apps.googleusercontent.com,APPROVER_EMAILS=jeremy@datadinosaur.com,ANALYST_EMAILS=jdegardeyn@datadinosaur.com,ADMIN_EMAILS=datadinosaur.noreply@gmail.com,STEWARD_URL=$(gcloud run services describe finchat-${ENV}-steward --region ${REGION} --format='value(status.url)' 2>/dev/null || true),AI_GATEWAY_URL=${AI_GATEWAY_URL}${UI_PINS} --allow-unauthenticated"

      # Rebuilt only when the pipeline actually changed. It used to run on every deploy to
      # every environment, costing a docker build and push each time, and because it was
      # continue-on-error it failed silently — leaving an exit-1 annotation that made a
      # green run look broken and cost real time to diagnose.
      #
      # "Changed" is decided against what is PUBLISHED, not against the push's file list:
      # the template records the image it was built from, and that image's tag is the
      # commit that built it. That works for workflow_dispatch too, where there are no
      # changed paths to filter on, and it self-corrects if an earlier build was skipped.
      #
      # continue-on-error is gone. The permissions it needs are granted in foundation, so
      # a failure here is worth stopping for rather than discovering later when a pipeline
      # job will not start.
      - name: Build Dataflow Flex Template
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT}/finchat-${ENV}-images"
          SHA="${GITHUB_SHA::12}"
          SPEC="gs://finchat-${ENV}-dataflow/templates/txn-pipeline.json"
          DIR="products/transactions/pipeline"

          LIVE_TAG="$(gcloud storage cat "$SPEC" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["image"].rsplit(":",1)[-1])' \
            2>/dev/null || true)"

          if [ -n "$LIVE_TAG" ] && git cat-file -e "${LIVE_TAG}^{commit}" 2>/dev/null \
             && git diff --quiet "$LIVE_TAG" HEAD -- "$DIR"; then
            echo "${DIR} unchanged since ${LIVE_TAG}; template left as published."
            exit 0
          fi
          echo "Rebuilding template: published=${LIVE_TAG:-none} -> ${SHA}"

          docker build -t "${REPO}/txn-pipeline:${SHA}" "$DIR"
          docker push "${REPO}/txn-pipeline:${SHA}"
          gcloud dataflow flex-template build "$SPEC" \
            --image "${REPO}/txn-pipeline:${SHA}" --sdk-language PYTHON \
            --metadata-file "$DIR/metadata.json"
